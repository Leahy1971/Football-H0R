<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>⚽ Football Connect</h1>
            </div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/clubs.html" class="nav-link">Clubs</a>
                <a href="/players.html" class="nav-link active">Players</a>
                <div class="nav-user" id="navUser" style="display: none;">
                    <a href="/dashboard.html" class="nav-link">Dashboard</a>
                    <a href="/messages.html" class="nav-link" id="messagesLink">
                        Messages
                        <span class="badge" id="messagesBadge" style="display: none;">0</span>
                    </a>
                    <a href="/notifications.html" class="nav-link" id="notificationsLink">
                        Notifications
                        <span class="badge" id="notificationsBadge" style="display: none;">0</span>
                    </a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
                <div class="nav-auth" id="navAuth">
                    <a href="/login.html" class="btn btn-small">Login</a>
                    <a href="/register.html" class="btn btn-small btn-primary">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Player Listings</h1>
            <a href="/add-player.html" class="btn btn-primary" id="addPlayerBtn" style="display: none;">+ Add Player</a>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Listing Type</label>
                <select id="filterType" class="search-input">
                    <option value="">All</option>
                    <option value="available">Available Players</option>
                    <option value="required">Required Players</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Position</label>
                <select id="filterPosition" class="search-input">
                    <option value="">All Positions</option>
                    <option value="Goalkeeper">Goalkeeper</option>
                    <option value="Defender">Defender</option>
                    <option value="Midfielder">Midfielder</option>
                    <option value="Forward">Forward</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="searchPlayer" placeholder="Search by name..." class="search-input">
            </div>
        </div>

        <div id="playersContainer" class="cards-grid"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Football Connect. Connecting clubs and players worldwide.</p>
        </div>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        let allPlayers = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            
            if (currentUser) {
                document.getElementById('addPlayerBtn').style.display = 'block';
            }
            
            await loadPlayers();
            setupFilters();
        });
        
        async function loadPlayers() {
            try {
                const response = await fetch('/api/players');
                allPlayers = await response.json();
                displayPlayers(allPlayers);
            } catch (error) {
                console.error('Failed to load players:', error);
            }
        }
        
        function displayPlayers(players) {
            const container = document.getElementById('playersContainer');
            
            if (players.length === 0) {
                container.innerHTML = '<p class="text-center">No player listings found.</p>';
                return;
            }
            
            container.innerHTML = players.map(player => `
                <div class="card" onclick="window.location.href='/player-detail.html?id=${player.id}'">
                    ${player.image_url ? `<img src="${player.image_url}" alt="${player.player_name}" class="card-image">` : ''}
                    <h3 class="card-title">${player.player_name}</h3>
                    <div class="card-meta">${player.position || 'N/A'} • ${player.age ? player.age + ' years' : 'Age N/A'}</div>
                    <p class="card-description">${player.bio ? player.bio.substring(0, 100) + '...' : 'No description'}</p>
                    <div class="card-tags">
                        <span class="tag ${player.listing_type === 'available' ? 'tag-success' : 'tag-primary'}">
                            ${player.listing_type === 'available' ? 'Available' : 'Required'}
                        </span>
                        ${player.club_name ? `<span class="tag">${player.club_name}</span>` : ''}
                        ${player.availability ? `<span class="tag">${player.availability}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function setupFilters() {
            const filterType = document.getElementById('filterType');
            const filterPosition = document.getElementById('filterPosition');
            const searchPlayer = document.getElementById('searchPlayer');
            
            function applyFilters() {
                let filtered = allPlayers;
                
                const type = filterType.value;
                if (type) {
                    filtered = filtered.filter(p => p.listing_type === type);
                }
                
                const position = filterPosition.value;
                if (position) {
                    filtered = filtered.filter(p => p.position === position);
                }
                
                const search = searchPlayer.value.toLowerCase();
                if (search) {
                    filtered = filtered.filter(p => 
                        p.player_name.toLowerCase().includes(search) ||
                        (p.bio && p.bio.toLowerCase().includes(search))
                    );
                }
                
                displayPlayers(filtered);
            }
            
            filterType.addEventListener('change', applyFilters);
            filterPosition.addEventListener('change', applyFilters);
            searchPlayer.addEventListener('input', applyFilters);
        }
    </script>
</body>
</html>
