<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>⚽ Football Connect</h1>
            </div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/clubs.html" class="nav-link active">Clubs</a>
                <a href="/players.html" class="nav-link">Players</a>
                <div class="nav-user" id="navUser" style="display: none;">
                    <a href="/dashboard.html" class="nav-link">Dashboard</a>
                    <a href="/messages.html" class="nav-link">Messages<span class="badge" id="messagesBadge" style="display: none;">0</span></a>
                    <a href="/notifications.html" class="nav-link">Notifications<span class="badge" id="notificationsBadge" style="display: none;">0</span></a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
                <div class="nav-auth" id="navAuth">
                    <a href="/login.html" class="btn btn-small">Login</a>
                    <a href="/register.html" class="btn btn-small btn-primary">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Football Clubs</h1>
            <a href="/add-club.html" class="btn btn-primary" id="addClubBtn" style="display: none;">+ Add Club</a>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="searchClub" placeholder="Search clubs..." class="search-input">
            </div>
        </div>

        <div id="clubsContainer" class="cards-grid"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Football Connect. Connecting clubs and players worldwide.</p>
        </div>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        let allClubs = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            if (currentUser) document.getElementById('addClubBtn').style.display = 'block';
            await loadClubs();
            setupFilters();
        });
        
        async function loadClubs() {
            try {
                const response = await fetch('/api/clubs');
                allClubs = await response.json();
                displayClubs(allClubs);
            } catch (error) {
                console.error('Failed to load clubs:', error);
            }
        }
        
        function displayClubs(clubs) {
            const container = document.getElementById('clubsContainer');
            if (clubs.length === 0) {
                container.innerHTML = '<p class="text-center">No clubs found.</p>';
                return;
            }
            container.innerHTML = clubs.map(club => `
                <div class="card" onclick="window.location.href='/club-detail.html?id=${club.id}'">
                    ${club.image_url ? `<img src="${club.image_url}" alt="${club.club_name}" class="card-image">` : ''}
                    <h3 class="card-title">${club.club_name}</h3>
                    <div class="card-meta">${club.location || 'Location N/A'}</div>
                    <p class="card-description">${club.description ? club.description.substring(0, 100) + '...' : 'No description'}</p>
                    <div class="card-tags">
                        ${club.level ? `<span class="tag tag-primary">${club.level}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function setupFilters() {
            const searchClub = document.getElementById('searchClub');
            searchClub.addEventListener('input', () => {
                const search = searchClub.value.toLowerCase();
                const filtered = allClubs.filter(c => 
                    c.club_name.toLowerCase().includes(search) ||
                    (c.location && c.location.toLowerCase().includes(search)) ||
                    (c.description && c.description.toLowerCase().includes(search))
                );
                displayClubs(filtered);
            });
        }
    </script>
</body>
</html>
