<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><h1>⚽ Football Connect</h1></div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <div class="nav-user" id="navUser">
                    <a href="/dashboard.html" class="nav-link">Dashboard</a>
                    <a href="/messages.html" class="nav-link">Messages</a>
                    <a href="/notifications.html" class="nav-link active">Notifications</a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem; max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Notifications</h1>
            <button class="btn btn-small" onclick="markAllRead()">Mark All Read</button>
        </div>
        <div id="notificationsContainer"></div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await checkAuth();
            if (!isAuth) {
                window.location.href = '/login.html';
                return;
            }
            await loadNotifications();
        });
        
        async function loadNotifications() {
            try {
                const response = await fetch('/api/notifications');
                const notifications = await response.json();
                displayNotifications(notifications);
            } catch (error) {
                console.error('Failed to load notifications:', error);
            }
        }
        
        function displayNotifications(notifications) {
            const container = document.getElementById('notificationsContainer');
            if (notifications.length === 0) {
                container.innerHTML = '<p class="text-center">No notifications</p>';
                return;
            }
            container.innerHTML = notifications.map(n => `
                <div class="notification-item ${n.read_status ? '' : 'unread'}" onclick="markRead(${n.id})">
                    <div class="notification-header">
                        <strong>${n.type ? n.type.replace('_', ' ').toUpperCase() : 'NOTIFICATION'}</strong>
                        <span class="notification-time">${formatDate(n.created_at)}</span>
                    </div>
                    <p>${n.message}</p>
                </div>
            `).join('');
        }
        
        async function markRead(id) {
            try {
                await fetch(`/api/notifications/${id}`, { method: 'PUT' });
                await loadNotifications();
                updateNotificationCount();
            } catch (error) {
                console.error('Failed to mark notification as read:', error);
            }
        }
        
        async function markAllRead() {
            try {
                await fetch('/api/notifications/read/all', { method: 'PUT' });
                await loadNotifications();
                updateNotificationCount();
            } catch (error) {
                console.error('Failed to mark all as read:', error);
            }
        }
    </script>
</body>
</html>
