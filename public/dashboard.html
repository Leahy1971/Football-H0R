<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><h1>⚽ Football Connect</h1></div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/clubs.html" class="nav-link">Clubs</a>
                <a href="/players.html" class="nav-link">Players</a>
                <div class="nav-user" id="navUser">
                    <a href="/dashboard.html" class="nav-link active">Dashboard</a>
                    <a href="/messages.html" class="nav-link">Messages<span class="badge" id="messagesBadge" style="display: none;">0</span></a>
                    <a href="/notifications.html" class="nav-link">Notifications<span class="badge" id="notificationsBadge" style="display: none;">0</span></a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <h1>Dashboard</h1>
        
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Quick Actions</h3>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <a href="/add-club.html" class="btn btn-primary">+ Add Club</a>
                    <a href="/add-player.html" class="btn btn-primary">+ Add Player</a>
                    <a href="/connections.html" class="btn">Manage Connections</a>
                </div>
            </div>
            
            <div class="dashboard-card">
                <h3>My Listings</h3>
                <div id="myListings"></div>
            </div>
            
            <div class="dashboard-card">
                <h3>Recent Notifications</h3>
                <div id="recentNotifications"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Football Connect. Connecting clubs and players worldwide.</p>
        </div>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await checkAuth();
            if (!isAuth) {
                window.location.href = '/login.html';
                return;
            }
            loadMyListings();
            loadRecentNotifications();
        });
        
        async function loadMyListings() {
            try {
                const [playersRes, clubsRes] = await Promise.all([
                    fetch('/api/players'),
                    fetch('/api/clubs')
                ]);
                const players = await playersRes.json();
                const clubs = await clubsRes.json();
                
                const myPlayers = players.filter(p => p.user_id === currentUser.id);
                const myClubs = clubs.filter(c => c.user_id === currentUser.id);
                
                const container = document.getElementById('myListings');
                container.innerHTML = `
                    <p><strong>${myClubs.length}</strong> Clubs</p>
                    <p><strong>${myPlayers.length}</strong> Players</p>
                    <div style="margin-top: 1rem;">
                        ${myClubs.map(c => `<div style="margin-bottom: 0.5rem;"><a href="/club-detail.html?id=${c.id}">${c.club_name}</a></div>`).join('')}
                        ${myPlayers.map(p => `<div style="margin-bottom: 0.5rem;"><a href="/player-detail.html?id=${p.id}">${p.player_name}</a></div>`).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Failed to load listings:', error);
            }
        }
        
        async function loadRecentNotifications() {
            try {
                const response = await fetch('/api/notifications');
                const notifications = await response.json();
                const container = document.getElementById('recentNotifications');
                
                if (notifications.length === 0) {
                    container.innerHTML = '<p>No notifications</p>';
                    return;
                }
                
                container.innerHTML = notifications.slice(0, 5).map(n => `
                    <div style="margin-bottom: 1rem; padding: 0.5rem; background: ${n.read_status ? 'transparent' : '#eff6ff'}; border-radius: 0.25rem;">
                        <p style="margin: 0;">${n.message}</p>
                        <small class="card-meta">${formatDate(n.created_at)}</small>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load notifications:', error);
            }
        }
    </script>
</body>
</html>
