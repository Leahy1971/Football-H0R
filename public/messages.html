<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><h1>⚽ Football Connect</h1></div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/clubs.html" class="nav-link">Clubs</a>
                <a href="/players.html" class="nav-link">Players</a>
                <div class="nav-user" id="navUser">
                    <a href="/dashboard.html" class="nav-link">Dashboard</a>
                    <a href="/messages.html" class="nav-link active">Messages<span class="badge" id="messagesBadge" style="display: none;">0</span></a>
                    <a href="/notifications.html" class="nav-link">Notifications<span class="badge" id="notificationsBadge" style="display: none;">0</span></a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <h1>Messages</h1>
        <div class="messages-container">
            <div class="conversations-list" id="conversationsList"></div>
            <div class="chat-container" id="chatContainer">
                <div class="chat-header" id="chatHeader">Select a conversation</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input" id="chatInput" style="display: none;">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        let selectedUserId = null;
        let connections = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await checkAuth();
            if (!isAuth) {
                window.location.href = '/login.html';
                return;
            }
            await loadConnections();
            
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
        
        async function loadConnections() {
            try {
                const response = await fetch('/api/connections');
                connections = await response.json();
                displayConnections();
            } catch (error) {
                console.error('Failed to load connections:', error);
            }
        }
        
        function displayConnections() {
            const container = document.getElementById('conversationsList');
            if (connections.length === 0) {
                container.innerHTML = '<p style="padding: 1rem;">No connections yet. <a href="/connections.html">Connect with users</a></p>';
                return;
            }
            container.innerHTML = connections.map(c => `
                <div class="conversation-item" onclick="selectConversation(${c.user_id || c.connected_user_id})">
                    <strong>${c.username}</strong>
                    ${c.full_name ? `<div class="card-meta">${c.full_name}</div>` : ''}
                </div>
            `).join('');
        }
        
        async function selectConversation(userId) {
            selectedUserId = userId;
            const user = connections.find(c => (c.user_id === userId || c.connected_user_id === userId));
            
            document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('chatHeader').textContent = user.username;
            document.getElementById('chatInput').style.display = 'flex';
            
            await loadMessages();
            setInterval(loadMessages, 5000);
        }
        
        async function loadMessages() {
            if (!selectedUserId) return;
            
            try {
                const response = await fetch(`/api/messages/${selectedUserId}`);
                const messages = await response.json();
                displayMessages(messages);
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }
        
        function displayMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (messages.length === 0) {
                container.innerHTML = '<p class="text-center">No messages yet. Start the conversation!</p>';
                return;
            }
            container.innerHTML = messages.map(m => `
                <div class="message ${m.sender_id === currentUser.id ? 'message-sent' : 'message-received'}">
                    <div>${m.message}</div>
                    <div class="message-time">${formatDate(m.created_at)}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !selectedUserId) return;
            
            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ receiver_id: selectedUserId, message })
                });
                
                if (response.ok) {
                    input.value = '';
                    await loadMessages();
                }
            } catch (error) {
                console.error('Failed to send message:', error);
            }
        }
    </script>
</body>
</html>
