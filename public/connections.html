<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><h1>⚽ Football Connect</h1></div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <div class="nav-user" id="navUser">
                    <a href="/dashboard.html" class="nav-link">Dashboard</a>
                    <a href="/messages.html" class="nav-link">Messages</a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <h1>My Connections</h1>
        
        <div style="margin-bottom: 3rem;">
            <h2>Pending Requests</h2>
            <div id="pendingRequests" class="cards-grid"></div>
        </div>
        
        <div>
            <h2>Connected Users</h2>
            <div id="connectedUsers" class="cards-grid"></div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await checkAuth();
            if (!isAuth) {
                window.location.href = '/login.html';
                return;
            }
            await loadPendingRequests();
            await loadConnections();
        });
        
        async function loadPendingRequests() {
            try {
                const response = await fetch('/api/connections/pending');
                const requests = await response.json();
                const container = document.getElementById('pendingRequests');
                
                if (requests.length === 0) {
                    container.innerHTML = '<p>No pending requests</p>';
                    return;
                }
                
                container.innerHTML = requests.map(r => `
                    <div class="card">
                        <h3>${r.username}</h3>
                        ${r.full_name ? `<p>${r.full_name}</p>` : ''}
                        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                            <button class="btn btn-success btn-small" onclick="acceptConnection(${r.id})">Accept</button>
                            <button class="btn btn-danger btn-small" onclick="rejectConnection(${r.id})">Reject</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load pending requests:', error);
            }
        }
        
        async function loadConnections() {
            try {
                const response = await fetch('/api/connections');
                const connections = await response.json();
                const container = document.getElementById('connectedUsers');
                
                if (connections.length === 0) {
                    container.innerHTML = '<p>No connections yet</p>';
                    return;
                }
                
                container.innerHTML = connections.map(c => `
                    <div class="card">
                        <h3>${c.username}</h3>
                        ${c.full_name ? `<p>${c.full_name}</p>` : ''}
                        <div style="margin-top: 1rem;">
                            <a href="/messages.html" class="btn btn-primary btn-small">Message</a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load connections:', error);
            }
        }
        
        async function acceptConnection(id) {
            try {
                await fetch(`/api/connections/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'accepted' })
                });
                await loadPendingRequests();
                await loadConnections();
            } catch (error) {
                console.error('Failed to accept connection:', error);
            }
        }
        
        async function rejectConnection(id) {
            try {
                await fetch(`/api/connections/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'rejected' })
                });
                await loadPendingRequests();
            } catch (error) {
                console.error('Failed to reject connection:', error);
            }
        }
    </script>
</body>
</html>
