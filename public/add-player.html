<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Player - Football Connect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><h1>⚽ Football Connect</h1></div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <div class="nav-user" id="navUser">
                    <a href="/dashboard.html" class="nav-link">Dashboard</a>
                    <span class="nav-link username" id="navUsername"></span>
                    <button class="btn btn-small" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="form-container">
            <h2 class="text-center">Add Player Listing</h2>
            <form id="playerForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Listing Type *</label>
                    <select id="listing_type" name="listing_type" required>
                        <option value="available">Available Player</option>
                        <option value="required">Required Player</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Player Name *</label>
                    <input type="text" id="player_name" name="player_name" required>
                </div>
                <div class="form-group">
                    <label>Position *</label>
                    <select id="position" name="position" required>
                        <option value="">Select position</option>
                        <option value="Goalkeeper">Goalkeeper</option>
                        <option value="Defender">Defender</option>
                        <option value="Midfielder">Midfielder</option>
                        <option value="Forward">Forward</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" name="age" min="5" max="99">
                </div>
                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="experience" name="experience" placeholder="e.g., 5 years, Youth level">
                </div>
                <div class="form-group">
                    <label>Bio / Description</label>
                    <textarea id="bio" name="bio" placeholder="Describe the player..."></textarea>
                </div>
                <div class="form-group">
                    <label>Availability</label>
                    <input type="text" id="availability" name="availability" placeholder="e.g., Immediate, Summer 2024">
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>
                <div class="form-group">
                    <label>YouTube Video URL</label>
                    <input type="url" id="video_url" name="video_url" placeholder="https://youtube.com/watch?v=...">
                </div>
                <div id="message"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Add Player Listing</button>
            </form>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await checkAuth();
            if (!isAuth) {
                window.location.href = '/login.html';
                return;
            }
        });

        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('listing_type', document.getElementById('listing_type').value);
            formData.append('player_name', document.getElementById('player_name').value);
            formData.append('position', document.getElementById('position').value);
            formData.append('age', document.getElementById('age').value);
            formData.append('experience', document.getElementById('experience').value);
            formData.append('bio', document.getElementById('bio').value);
            formData.append('availability', document.getElementById('availability').value);
            formData.append('video_url', document.getElementById('video_url').value);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) formData.append('image', imageFile);
            
            try {
                const response = await fetch('/api/players', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('message', 'Player listing created successfully!');
                    setTimeout(() => {
                        window.location.href = '/players.html';
                    }, 1500);
                } else {
                    showError('message', data.error || 'Failed to create listing');
                }
            } catch (error) {
                showError('message', 'Failed to create listing. Please try again.');
            }
        });
    </script>
</body>
</html>
